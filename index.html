<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>同难客栈</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html,body{margin:0;padding:0;background:#0e0a07;height:100%;height:100dvh;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif}
body{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
#g{position:fixed;left:0;top:0;z-index:0;display:block;touch-action:none}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(8,5,3,.55) 100%)}
#flash{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0}
#c{position:relative;z-index:2;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
.touch #ui{display:block}
#joy{position:absolute;left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(20,14,10,.25),rgba(14,10,7,.55));border:1.5px solid rgba(200,168,106,.6);box-shadow:inset 0 0 18px rgba(0,0,0,.5);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#e8d6ac,#a8844a 70%,#5a3e22);box-shadow:0 2px 8px rgba(0,0,0,.6);opacity:.92}
#btns{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:200px;height:190px;pointer-events:none}
.b{position:absolute;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 40% 30%,rgba(60,42,28,.75),rgba(16,11,8,.82));border:1.5px solid rgba(200,168,106,.85);box-shadow:0 2px 8px rgba(0,0,0,.55),inset 0 0 0 3px rgba(200,168,106,.12);color:#ecd9ae;text-shadow:0 1px 2px #000;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-weight:bold;font-size:24px;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
.b.on{background:radial-gradient(circle,rgba(220,190,130,.9),rgba(150,110,60,.9));color:#2a160a;transform:scale(.93)}
.b.big{width:74px;height:74px;font-size:30px}
#menu{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));width:44px;height:44px;font-size:20px}
#ch{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px;pointer-events:auto}
#ch button,#cont,#pz button,#rot button{font:inherit;font-size:17px;font-weight:600;padding:11px 20px;border-radius:4px;background:linear-gradient(rgba(44,32,22,.94),rgba(18,13,9,.96));color:#f0e2c2;border:1.5px solid rgba(200,168,106,.85);box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 0 0 3px rgba(200,168,106,.12);touch-action:none;margin:2px}
#ch button:active{background:#c8a86a;color:#2a160a}
#cont{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24% + env(safe-area-inset-bottom));pointer-events:auto;display:none}
#pz{position:absolute;inset:0;background:rgba(8,5,3,.75);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:auto;color:#e2c88e;font-size:32px;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;letter-spacing:.3em}
@media (orientation:landscape){.touch #joy{width:112px;height:112px;left:calc(10px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom))}.touch #knob{left:31px;top:31px}
.touch #btns{width:120px;height:250px;right:calc(6px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom))}
.touch .b{width:50px;height:50px;font-size:20px}.touch .b.big{width:58px;height:58px;font-size:24px}
.touch [data-k=KeyJ]{right:0!important;bottom:0!important}.touch [data-k=KeyE]{right:62px!important;bottom:0!important}
.touch [data-k=KeyK]{right:0!important;bottom:64px!important}.touch [data-k=KeyQ]{right:62px!important;bottom:64px!important}.touch [data-k=KeyL]{right:31px!important;bottom:120px!important}
.touch #menu{width:40px;height:40px;font-size:18px;top:calc(6px + env(safe-area-inset-top));left:calc(6px + env(safe-area-inset-left));right:auto}}
#rot{position:fixed;inset:0;z-index:20;background:rgba(10,6,3,.94);color:#e2c88e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:26px;text-align:center;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif}
#rot small{color:#efe2c4;font-size:16px}
</style></head>

<div id="btns"><div class="b big" data-k="KeyJ" style="right:0;bottom:0">勺</div><div class="b big" data-k="KeyE" style="right:84px;bottom:0">谈</div>

<div class="b" id="menu">☰</div><div id="ch"></div><button id="cont">C · 继续存档</button><script>if(("ontouchstart" in window)||navigator.maxTouchPoints>0)document.getElementById("cont").textContent="继续存档";</script>

 qiao:{name:'乔不留',role:'跑堂',col:'#3a6ea8',quirk:'金盆洗手的神偷，见钱袋就手痒'},

 if(EP==0&&(ph=='serve'||ph=='serve0')||EP==1&&(ph=='clue'||ph=='accuse'))TB.forEach(([x,y],i)=>NPCS.inn.push({id:'g'+i,x:x+(i%2?1:0),y:y-1,name:EP==1?['书生客','卖艺的','老大娘','胖客人'][i]:(i+1)+'号桌客人',col:['#865','#568','#a63','#777'][i]}));
 if(EP==4&&ph=='boss'){NPCS.inn=[];NPCS.yard=[];NPCS.street=[{id:'liu',x:12,y:5},{id:'wen',x:17,y:5},{id:'qiao',x:4,y:9},{id:'ya',x:25,y:9},{id:'zhou',x:14,y:14}];}}
const P={x:0,y:0,hp:10,max:10,dir:{x:0,y:1},cd:0,inv:0,coins:0,buns:2,swing:0,kx:0,ky:0,dash:0,dcd:0};

 if(st%4==0)tone(base/2*Math.pow(2,BAS[(st>>2)%8]/12),'sine',.05,.7);}catch(e){}}

 {t:'第一回 · 开张不吉',gag:'三娘：“盘子没碎一个，人倒躺了三个——今天赚了！”',moral:'同难客栈的规矩：活儿一起干，锅一起背。'},
 {t:'第二回 · 钱袋失踪',gag:'乔不留：“我早金盆洗手了。那盆……也被三娘卖了。”',moral:'被人怀疑时有人信你，这就叫“同难”。'},
 {t:'第三回 · 比武招亲',gag:'二丫：“招亲取消！本姑娘先招个能打的伙计。”',moral:'脾气再大，自家人拦得住；拦得住，才叫一家人。'},
 {t:'第四回 · 大厨失味',gag:'李大嘴：“这回放的是糖！……吧？”',moral:'一个人尝不出味道，大伙儿替你尝。'},
 {t:'第五回 · 同难同当',gag:'三娘：“打坏的门板，记金万两账上！”',moral:'同甘容易共苦难，同难客栈，偏偏就共了这个苦。'}];

 if(EP==1&&ph=='accuse'){accuse();return;}
 if(id[0]=='g'){say(nm,['快上菜！我都饿成剪影了！']);return;}
 if(id=='ya'&&EP==2&&ph=='talk2'){say(nm,['哼！黑鸭帮打跑了，可那帮主说我凶，没人敢娶！','我就是凶！凶怎么了？'],null,[['凶才好，护得住客栈。',()=>say(nm,['……算你会说话。今天的桌子我不砍了。'],recap)],['二丫，桌子是无辜的。',()=>say(CAST.liu.name,['对！砍坏的三张桌子，记你账上！','二丫：“娘——！”'],recap)]]);return;}
 if(id=='wen'&&EP==3&&ph=='back'){say(nm,['药齐了？我照书熬好了，大嘴兄，喝！','李大嘴：（咕咚）……我尝出来了！是咸的！'],null,[['那今晚的汤放糖还是放盐？',()=>say(nm,['你……闭眼抓吧。我、我替大伙儿先尝。'],recap)],['以后我尝不准，你们帮我尝！',()=>say('乔不留',['好兄弟！咱们同难客栈，舌头也能借！'],recap)]]);return;}
 if(id=='zhou'&&EP==0&&ph=='talk0'){say(nm,['站住！谁在本捕快辖区打架？','……三个地痞自己躺下的？'],null,[['是我打的，记我头上。',()=>say(nm,['好汉做事好汉当。那我写个“见义勇为”。','三娘：“写好了拿来，能抵房钱吗？”'],recap)],['他们自己摔的，地太滑。',()=>say(nm,['嗯，地滑。那就记“地面不平，掌柜负责”。','三娘：“？？？”'],recap)]]);return;}
 const G={liu:['（噼里啪啦）这月你打碎碗两只，扣六文；帮我挡了一刀，加五文——你还欠我一文。'],
  wen:['子曰：“学而时习之，不亦……不亦饿乎？”……我一紧张就背串了。'],
  qiao:['大嘴，钱袋那回多亏你。……我手痒，不是想偷，是想帮人检查钱袋结不结实。'],
  ya:['谁说女子不如男？不服，先过我这把剑！'],
  zhou:['有事找我，没事也别找我——我胆小。']};
 say(nm,G[id]||['……']);}
function accuse(){say('李大嘴',['（凭我的鼻子……那人身上有偷吃的葱油饼味）偷钱袋的是——'],null,[['卖艺的！',()=>{ph='chase';setNPC();note(KT('卖艺的跑了！去大街追（K 闪身）','卖艺的跑了！去大街追（点「闪」闪身）'));}],['书生客！',()=>{sfx('bad');say('书生客',['冤枉啊！我连自己的钱袋都找不着！'],()=>ph='accuse');}],['乔不留？',()=>{sfx('bad');say('乔不留',['大嘴！连你也不信我？再想想！'],()=>ph='accuse');}]]);}
function update(){
 tick++;
 if(mode=='title'){if(hit('Enter')||hit('Space')){sfx('stage');mode='cast';}else if(hit('KeyC')&&hasSave())load();return;}
 if(mode=='cast'){if(hit('Enter')||hit('Space')){P.coins=0;P.buns=2;startEP(0);}return;}
 if(mode=='recap'){if(hit('Enter')||hit('Space')){if(EP<4)startEP(EP+1);else mode='end';}return;}
 if(mode=='over'){if(hit('Enter')||hit('KeyR'))startEP(EP);return;}
 if(mode=='end'){if(hit('Enter')||hit('KeyR'))mode='title';return;}
 if(dlg){if(hit('KeyE')||hit('Space')||hit('Enter')||hit('KeyJ')){if(!(dlg.choices&&dlg.i==dlg.lines.length-1)){dlg.i++;sfx('talk');if(dlg.i>=dlg.lines.length){const a=dlg.after;dlg=null;a&&a();}}}
  if(dlg&&dlg.choices&&dlg.i==dlg.lines.length-1){for(let c=0;c<dlg.choices.length;c++)if(hit('Digit'+(c+1))){const f=dlg.choices[c][1],a=dlg.after;dlg=null;f();a&&a();break;}}return;}
 let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
 if(dx||dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l;P.dir={x:dx,y:dy};}
 if(P.dcd>0)P.dcd--;if((hit('KeyK')||hit('ShiftLeft'))&&P.dcd<=0){P.dash=10;P.dcd=40;sfx('dash');}
 let sp=2.7;if(P.dash>0){P.dash--;sp=8;dx=P.dir.x;dy=P.dir.y;parts.push({x:P.x,y:P.y+8,vx:0,vy:0,l:12,c:'#cde'});}
 move(P,dx*sp+P.kx,dy*sp+P.ky,10);P.kx*=.8;P.ky*=.8;
 if(P.cd>0)P.cd--;if(P.inv>0)P.inv--;if(P.swing>0)P.swing--;
 if((hit('KeyJ')||hit('Space'))&&P.cd<=0){P.cd=18;P.swing=12;sfx('slash');slash();}
 if(P.tcd>0)P.tcd--;if(hit('KeyL')&&!(P.tcd>0)){P.tcd=30;sfx('dash');shots.push({x:P.x,y:P.y,vx:P.dir.x*7,vy:P.dir.y*7,l:70});}
 for(const b of shots){b.x+=b.vx;b.y+=b.vy;b.l--;if(solid(b.x,b.y))b.l=0;for(const e of ents)if(b.l>0&&e.hp>0&&e.area==area&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){b.l=0;hitE(e,b.vx/7,b.vy/7);}}shots=shots.filter(b=>b.l>0);
 if(hit('KeyQ')){if(P.buns>0&&P.hp<P.max){P.buns--;P.hp=Math.min(P.max,P.hp+5);note('吃了个肉包子，气血+5');}else note(P.buns?'气血已满':'包子吃完了');}
 const A=AREAS[area];
 if(hit('KeyE')){let done=false;
  if(ph=='serve'&&area=='inn'){if(!carry&&P.y<4*T+8&&P.x>11*T&&P.x<19*T){carry=order;sfx('dish');note('端起：'+carry+'号桌的菜');done=true;}
   else if(carry){for(let i=0;i<4;i++){const [x,y]=TB[i];if(Math.hypot(x*T+32-P.x,y*T+16-P.y)<64){done=true;if(i+1==carry){served++;P.coins+=5;sfx('coin');floats.push({x:P.x,y:P.y-20,s:'+5文',l:50});note('上菜成功 '+served+'/5');order=1+Math.floor(Math.random()*4);}else{P.coins=Math.max(0,P.coins-3);sfx('bad');note('送错桌了！扣三文（掌柜的算盘响了）');}carry=0;break;}}}}
  if(!done)for(const n of NPCS[area])if(Math.hypot(n.x*T+16-P.x,n.y*T+16-P.y)<56){talk(n);break;}}
 for(const s in A.exits){const e=A.exits[s];const go=(s=='E'&&P.x>W-6)||(s=='W'&&P.x<6)||(s=='N'&&P.y<6)||(s=='S'&&P.y>H-6);
  if(go){if(ph=='boss'||ph=='serve'){P.x=Math.max(20,Math.min(W-20,P.x));P.y=Math.max(20,Math.min(H-20,P.y));if(ph=='serve')note('上菜呢，别乱跑！');break;}enter(e[2],e[3]!=null?e[3]*T+16:P.x,e[4]!=null?e[4]*T+16:P.y);onEnter();return;}}
 if(ph=='serve'){timer--;if(timer<=0){ph='serve0';carry=0;served=0;sfx('bad');say(CAST.liu.name,['时间到！一桌客人饿跑了——还没给钱！','重来！再慢，扣你下辈子的工钱。'],()=>{ph='serve';timer=3600;});}}
 for(const e of ents){if(e.hp<=0||e.area!=area)continue;if(e.hurt>0)e.hurt--;const vx=P.x-e.x,vy=P.y-e.y,d=Math.hypot(vx,vy)||1;
  if(e.t=='thief'){if(e.hurt>0){}else if(d<240)move(e,-vx/d*e.sp,-vy/d*e.sp,e.r);else move(e,Math.cos(tick/40)*1.2,Math.sin(tick/50)*1.2,e.r);}
  else if(e.t=='boss'){e.cd--;if(e.st==0){move(e,vx/d*e.sp,vy/d*e.sp,e.r);if(e.cd<=0){e.st=1;e.ch=40;e.cdx=vx/d;e.cdy=vy/d;}}
   else if(e.st==1){e.ch--;if(e.ch<=0){e.st=2;e.ch=30;}}
   else{move(e,e.cdx*6.5,e.cdy*6.5,e.r);if(--e.ch<=0){e.st=0;e.cd=e.hp<20?70:110;if(e.hp<20&&ents.filter(q=>q.hp>0).length<4)ents.push(mkEnemy('goon',15*T,5*T));}}}
  else if(d<360)move(e,vx/d*e.sp,vy/d*e.sp,e.r);
  if(e.dmg&&d<e.r+11)hurtP(e.dmg,vx/d,vy/d);}
 if(ph=='boss'){if(--allyT<=0){allyT=200;const b=ents.find(e=>e.t=='boss'&&e.hp>0);if(b){const L=[['柳二丫','一剑！'],['乔不留','毛巾抽脸！'],['温如玉','子曰：看砖！'],['周铁头','我不叫人了！'],['柳三娘','算盘砸脸，不收钱！']];const [w,s]=L[(tick>>3)%5];b.hp-=2;b.hurt=10;sfx('hit');floats.push({x:b.x-40,y:b.y-50,s:w+'：'+s,l:80});if(b.hp<=0){b.hp=0;win();}}}}
 for(const it of items)if(!it.got&&area=='hill'&&Math.hypot(it.x-P.x,it.y-P.y)<26){it.got=1;sfx('coin');note('采到：'+it.n+'（'+items.filter(i=>i.got).length+'/4）');}
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.l--;}parts=parts.filter(p=>p.l>0);
 for(const f of floats){f.y-=.6;f.l--;}floats=floats.filter(f=>f.l>0);
 if(toastT>0)toastT--;
 progress();}
function onEnter(){
 if(EP==0&&ph=='thugs'&&area=='street'&&!ents.length){spawn([['thug',10,8],['thug',19,9],['thug',15,12]]);say('地痞头子',['新开张？保护费交一下：一桌一文，一人一文，一碗一文！'],()=>note(KT('J 挥大勺','点「勺」挥大勺')+'，把他们赶走'));}
 if(EP==1&&ph=='chase'&&area=='street'&&!ents.length){spawn([['thief',15,10]]);note(KT('他跑得快！用 K 闪身追上去','他跑得快！点「闪」闪身追上去'));}
 if(EP==2&&ph=='duck'&&area=='street'&&!ents.length){spawn([['duck',8,7],['duck',22,7],['duck',8,12],['duck',22,12],['duckboss',15,9]]);say('黑鸭帮主',['嘎！听说招亲？我们黑鸭帮包了！','谁赢了谁娶，娶完再白吃三年！'],()=>note('打退黑鸭帮'));}
 if(EP==3&&ph=='herbs'&&area=='hill'&&!items.length){items=[['甘草',5,4],['山椒',25,5],['薄荷',6,16],['野蜂蜜',24,15]].map(([n,x,y])=>({n,x:x*T+16,y:y*T+16}));spawn([['dog',10,5],['dog',20,14],['dog',22,4],['dog',8,14]]);}}
function progress(){if(dlg)return;const alive=ents.some(e=>e.hp>0&&e.area==area);
 if(EP==0&&ph=='serve'&&served>=5){ph='thugs';carry=0;setNPC();say(CAST.liu.name,['五道全对！大嘴，你这腿比你的炒勺还利索。','……门口怎么吵吵嚷嚷的？去看看！'],()=>note('去大街看看（大堂南门）'));}
 if(EP==0&&ph=='thugs'&&area=='street'&&ents.length&&!alive){ph='talk0';ents=[];say('乔不留',['地痞们一溜烟跑了。','周捕快这才从街角探出头来……'],()=>note('跟周铁头说话'));}
 if(EP==1&&ph=='chase'&&ents.length&&!alive){ph='done1';ents=[];P.coins+=20;say('卖艺的',['别打别打！钱袋还你！','钱老爷：“误会乔跑堂了，赏你们二十文！”乔不留：“大嘴，谢了兄弟。”','三娘：“交柜上。……算了，你自己留着。”'],recap);}
 if(EP==2&&ph=='duck'&&ents.length&&!alive){ph='talk2';ents=[];say('黑鸭帮主',['嘎——撤！这店的厨子比护院还狠！'],()=>note('回大堂找柳二丫'));}
 if(EP==3&&ph=='herbs'&&items.length&&items.every(i=>i.got)){ph='back';note('药齐了，回大堂找温如玉');}}
function win(){if(ph=='won')return;ph='won';ents.forEach(e=>e.hp=0);say('金万两',['一个厨子、一个跑堂、一个掌柜、一个书生、一个丫头、一个捕快……','怎么就打不散呢？','三娘：“因为这儿叫——同难客栈。”'],recap);}
function slash(){const reach=46;for(const e of ents){if(e.hp<=0||e.area!=area)continue;const vx=e.x-P.x,vy=e.y-P.y,d=Math.hypot(vx,vy);if(d>reach+e.r)continue;const dot=(vx*P.dir.x+vy*P.dir.y)/(d||1);if(dot<0.2&&d>e.r+4)continue;
 hitE(e,vx/(d||1),vy/(d||1));}}
function hitE(e,nx,ny){e.hp--;HS=e.t=='boss'?5:3;TRA=Math.min(1,TRA+(e.t=='boss'?.3:.22));if(e.hp<=0){TRA=Math.min(1,TRA+.2);FL=.22;FLC='#fff8e0';}e.hurt=e.t=='thief'?40:10;sfx('hit');const kb=e.t=='boss'?6:14;move(e,nx*kb,ny*kb,e.r);for(let i=0;i<6;i++)parts.push({x:e.x,y:e.y,vx:Math.random()*4-2,vy:Math.random()*4-2,l:20,c:i&1?'#fff8e0':'#ffd24a'});
 if(e.hp<=0){if(e.pay){P.coins+=e.pay;sfx('coin');floats.push({x:e.x,y:e.y,s:'+'+e.pay+'文',l:50});}if(e.t=='boss')win();}}
function hurtP(d,nx,ny){if(P.inv>0||P.dash>0)return;P.hp-=d;P.inv=50;HS=4;TRA=Math.min(1,TRA+.5);FL=.4;FLC='#c02818';P.kx=nx*5;P.ky=ny*5;sfx('hurt');if(P.hp<=0){P.hp=0;mode='over';}}

function rects(){const a=cv.getBoundingClientRect(),b=gcv.getBoundingClientRect();CR={l:a.left,t:a.top,w:a.width||1,h:a.height||1};GR={l:b.left,t:b.top,w:b.width||1,h:b.height||1};}
const _v=window.THREE?new THREE.Vector3():null;
function proj(x,h,z){if(!GL)return[x*T,z*T,1];_v.set(x,h,z).project(cam);const sx=GR.l+(_v.x+1)/2*GR.w,sy=GR.t+(1-_v.y)/2*GR.h;return[(sx-CR.l)/CR.w*W,(sy-CR.t)/CR.h*H,_v.z<1];}

function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const GOLD='#c8a86a',CREAM='#f1e6cc';
function ink(x,y,w,h,a=1){ctx.save();ctx.globalAlpha*=a;const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'rgba(30,22,16,.84)');g.addColorStop(1,'rgba(14,10,8,.9)');ctx.fillStyle=g;rrect(x,y,w,h,4);ctx.fill();
 ctx.strokeStyle='rgba(200,168,106,.8)';ctx.lineWidth=1.4;ctx.stroke();ctx.strokeStyle='rgba(200,168,106,.28)';ctx.lineWidth=1;rrect(x+5,y+5,w-10,h-10,2);ctx.stroke();
 ctx.strokeStyle=GOLD;ctx.lineWidth=2;const c=10;[[x+3,y+3,1,1],[x+w-3,y+3,-1,1],[x+3,y+h-3,1,-1],[x+w-3,y+h-3,-1,-1]].forEach(([a,b,sx,sy])=>{ctx.beginPath();ctx.moveTo(a,b+sy*c);ctx.lineTo(a,b);ctx.lineTo(a+sx*c,b);ctx.stroke();});ctx.restore();}
function tx(s,x,y,font,col,al='left',sh=.6){ctx.font=font;ctx.textAlign=al;ctx.textBaseline='alphabetic';if(sh){ctx.fillStyle='rgba(0,0,0,'+sh+')';ctx.fillText(s,x+1.5,y+1.5);}ctx.fillStyle=col;ctx.fillText(s,x,y);}

function wrap(s,x,y,w,lh){let line='';for(const ch of s){if(ctx.measureText(line+ch).width>w){ctx.fillText(line,x,y);y+=lh;line='';}line+=ch;}ctx.fillText(line,x,y);return y;}
